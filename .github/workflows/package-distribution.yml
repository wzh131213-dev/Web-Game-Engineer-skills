name: Build and publish skill ZIP packages

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'SKILL.md'
      - 'core/**'
      - 'modules/**'
      - 'team/**'
      - 'schemas/**'
      - 'adapters/**'
      - 'packages/**'
      - 'plugin-distribution/**'
      - 'release/**'
      - 'benchmarks/**'
      - 'docs/**'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - '.github/workflows/package-distribution.yml'
  workflow_dispatch:

concurrency:
  group: package-distribution-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Validate packages and build all ZIPs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/packages
          index="dist/packages/INDEX.md"
          {
            echo "# Downloadable Web & Game Engineer packages"
            echo
            echo "Generated from package manifests on main. Each archive is independently validated."
            echo
            echo "| Package | Version | ZIP | SHA-256 |"
            echo "|---|---|---|---|"
          } > "$index"

          shopt -s nullglob
          package_dirs=(packages/*/)
          test "${#package_dirs[@]}" -gt 0
          for package_dir in "${package_dirs[@]}"; do
            package_dir="${package_dir%/}"
            manifest="$package_dir/PACKAGE_MANIFEST.json"
            test -f "$manifest"
            package_id="$(jq -r '.package_id // empty' "$manifest")"
            package_version="$(jq -r '.package_version // empty' "$manifest")"
            test -n "$package_id" && test -n "$package_version"
            while IFS= read -r relative_file; do
              [ -n "$relative_file" ] || continue
              test -f "$package_dir/$relative_file" || { echo "::error::Missing $package_dir/$relative_file"; exit 1; }
            done < <(jq -r '.files[]?' "$manifest")
            archive="dist/packages/${package_id}-${package_version}.zip"
            rm -f "$archive" "$archive.sha256"
            zip -X -qr "$archive" "$package_dir"
            unzip -t "$archive" >/dev/null
            sha256sum "$archive" > "$archive.sha256"
            printf '| %s | %s | [%s](%s) | [checksum](%s.sha256) |\n' "$package_id" "$package_version" "$(basename "$archive")" "$(basename "$archive")" "$(basename "$archive")" >> "$index"
          done

          FULL_VERSION="$(jq -r '.release' release/VERSION.json)"
          zip_files=(README.md SKILL.md core modules team schemas adapters packages plugin-distribution release benchmarks docs CONTRIBUTING.md CHANGELOG.md SECURITY.md LICENSE-CHOICE-REQUIRED.txt .github/workflows)
          full_archive="dist/packages/web-game-engineer-full-${FULL_VERSION}.zip"
          rm -f "$full_archive" "$full_archive.sha256"
          zip -X -qr "$full_archive" "${zip_files[@]}"
          unzip -t "$full_archive" >/dev/null
          sha256sum "$full_archive" > "$full_archive.sha256"
          printf '| Full source bundle | %s | [%s](%s) | [checksum](%s.sha256) |\n' "$FULL_VERSION" "$(basename "$full_archive")" "$(basename "$full_archive")" "$(basename "$full_archive")" >> "$index"

          PLATFORM_VERSION="$(jq -r '.release' release/VERSION.json)"
          # Claude Code plugin archive: plugin manifest and self-contained Skill at archive root.
          root="plugin-distribution/claude"
          archive="dist/packages/web-game-engineer-claude-plugin-${PLATFORM_VERSION}.zip"
          test -f "$root/.claude-plugin/plugin.json" && test -f "$root/skills/web-game-engineer/SKILL.md"
          rm -f "$archive" "$archive.sha256"
          (cd "$root" && zip -X -qr "$GITHUB_WORKSPACE/$archive" .claude-plugin skills README.md INSTALL.md)
          unzip -t "$archive" >/dev/null
          sha256sum "$archive" > "$archive.sha256"
          echo "| Claude Code plugin | $PLATFORM_VERSION | [$(basename "$archive")]($(basename "$archive")) | [checksum]($(basename "$archive").sha256) |" >> "$index"

          # Claude.ai Agent Skill archive.
          root="plugin-distribution/claude/claude-ai-skill"
          archive="dist/packages/web-game-engineer-claude-skill-${PLATFORM_VERSION}.zip"
          test -f "$root/web-game-engineer/SKILL.md"
          rm -f "$archive" "$archive.sha256"
          (cd "$root" && zip -X -qr "$GITHUB_WORKSPACE/$archive" web-game-engineer)
          unzip -t "$archive" >/dev/null
          sha256sum "$archive" > "$archive.sha256"
          echo "| Claude.ai Agent Skill | $PLATFORM_VERSION | [$(basename "$archive")]($(basename "$archive")) | [checksum]($(basename "$archive").sha256) |" >> "$index"

          # Gemini Apps Skill: self-contained root-level SKILL.md.
          archive="dist/packages/web-game-engineer-gemini-skill-${PLATFORM_VERSION}.zip"
          rm -f "$archive" "$archive.sha256"
          (cd packages/gemini && zip -X -q "$GITHUB_WORKSPACE/$archive" SKILL.md)
          unzip -t "$archive" >/dev/null
          sha256sum "$archive" > "$archive.sha256"
          echo "| Gemini Apps Skill | $PLATFORM_VERSION | [$(basename "$archive")]($(basename "$archive")) | [checksum]($(basename "$archive").sha256) |" >> "$index"

          # Qwen Model Studio root Skill and Qwen Code named Skill folder.
          archive="dist/packages/web-game-engineer-qwen-agent-skill-${PLATFORM_VERSION}.zip"
          rm -f "$archive" "$archive.sha256"
          (cd packages/qwen && zip -X -q "$GITHUB_WORKSPACE/$archive" SKILL.md)
          unzip -t "$archive" >/dev/null
          sha256sum "$archive" > "$archive.sha256"
          echo "| Qwen Model Studio Agent Skill | $PLATFORM_VERSION | [$(basename "$archive")]($(basename "$archive")) | [checksum]($(basename "$archive").sha256) |" >> "$index"

          archive="dist/packages/web-game-engineer-qwen-code-skill-${PLATFORM_VERSION}.zip"
          stage="$RUNNER_TEMP/qwen-web-game-engineer"
          rm -rf "$stage" && mkdir -p "$stage/web-game-engineer"
          cp packages/qwen/SKILL.md "$stage/web-game-engineer/SKILL.md"
          rm -f "$archive" "$archive.sha256"
          (cd "$stage" && zip -X -qr "$GITHUB_WORKSPACE/$archive" web-game-engineer)
          unzip -t "$archive" >/dev/null
          sha256sum "$archive" > "$archive.sha256"
          echo "| Qwen Code Agent Skill | $PLATFORM_VERSION | [$(basename "$archive")]($(basename "$archive")) | [checksum]($(basename "$archive").sha256) |" >> "$index"

          # Portable prompt archives for DeepSeek and Doubao (not native Skill imports).
          for platform in deepseek doubao; do
            archive="dist/packages/web-game-engineer-${platform}-system-prompt-${PLATFORM_VERSION}.zip"
            rm -f "$archive" "$archive.sha256"
            (cd "packages/$platform" && zip -X -q "$GITHUB_WORKSPACE/$archive" SYSTEM_PROMPT.md)
            unzip -t "$archive" >/dev/null
            sha256sum "$archive" > "$archive.sha256"
            echo "| $platform system prompt (portable) | $PLATFORM_VERSION | [$(basename "$archive")]($(basename "$archive")) | [checksum]($(basename "$archive").sha256) |" >> "$index"
          done

      - name: Publish ZIPs and checksums to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/packages/
          if git diff --cached --quiet; then echo "No package archive changes."; exit 0; fi
          git commit -m "chore: publish skill package ZIPs [skip ci]"
          git push origin HEAD:main
