name: Build Claude Plugin ZIP

on:
  push:
    branches: [main]
    paths:
      - 'plugin-distribution/claude/**'
      - '.github/workflows/claude-plugin-package.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Validate Claude plugin and build ZIP
        shell: bash
        run: |
          set -euo pipefail
          root="plugin-distribution/claude"
          manifest="$root/.claude-plugin/plugin.json"
          skill="$root/skills/web-game-engineer/SKILL.md"
          test -f "$manifest"
          test -f "$skill"
          jq -e '.name == "web-game-engineer" and .version == "0.1.0-alpha"' "$manifest" >/dev/null
          grep -q '^name: web-game-engineer$' "$skill"
          grep -q '^description:' "$skill"

          mkdir -p dist/packages
          archive="dist/packages/web-game-engineer-claude-plugin-0.1.0-alpha.zip"
          rm -f "$archive" "$archive.sha256"
          (
            cd "$root"
            zip -X -qr "../../$archive" .claude-plugin skills README.md INSTALL.md
          )
          unzip -t "$archive"
          unzip -Z1 "$archive" | grep -Fxq '.claude-plugin/plugin.json'
          unzip -Z1 "$archive" | grep -Fxq 'skills/web-game-engineer/SKILL.md'
          sha256sum "$archive" > "$archive.sha256"

      - name: Commit plugin ZIP and checksum to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/packages/web-game-engineer-claude-plugin-0.1.0-alpha.zip dist/packages/web-game-engineer-claude-plugin-0.1.0-alpha.zip.sha256
          if git diff --cached --quiet; then
            echo "No Claude plugin archive changes."
            exit 0
          fi
          git commit -m "chore: publish Claude plugin ZIP [skip ci]"
          git push origin HEAD:main
