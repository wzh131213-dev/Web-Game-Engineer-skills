name: Publish six-platform GitHub Release

on:
  push:
    branches: [main]
    paths:
      - "release/RELEASE_NOW"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify six platform archives
        shell: bash
        run: |
          set -euo pipefail
          files=(
            web-game-engineer-chatgpt-0.1.3-alpha.zip
            web-game-engineer-claude-0.1.0-alpha.zip
            web-game-engineer-gemini-0.1.0-alpha.zip
            web-game-engineer-deepseek-0.1.0-alpha.zip
            web-game-engineer-qwen-0.1.0-alpha.zip
            web-game-engineer-doubao-0.1.0-alpha.zip
          )
          for file in "${files[@]}"; do
            test -s "dist/packages/$file"
            test -s "dist/packages/$file.sha256"
            (cd dist/packages && sha256sum -c "$file.sha256")
            unzip -t "dist/packages/$file" >/dev/null
          done

      - name: Create one release with all six ZIPs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.1.3-alpha-platform-bundle-20261122"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite immutable release assets."
            exit 1
          fi
          assets=(
            dist/packages/web-game-engineer-chatgpt-0.1.3-alpha.zip
            dist/packages/web-game-engineer-chatgpt-0.1.3-alpha.zip.sha256
            dist/packages/web-game-engineer-claude-0.1.0-alpha.zip
            dist/packages/web-game-engineer-claude-0.1.0-alpha.zip.sha256
            dist/packages/web-game-engineer-gemini-0.1.0-alpha.zip
            dist/packages/web-game-engineer-gemini-0.1.0-alpha.zip.sha256
            dist/packages/web-game-engineer-deepseek-0.1.0-alpha.zip
            dist/packages/web-game-engineer-deepseek-0.1.0-alpha.zip.sha256
            dist/packages/web-game-engineer-qwen-0.1.0-alpha.zip
            dist/packages/web-game-engineer-qwen-0.1.0-alpha.zip.sha256
            dist/packages/web-game-engineer-doubao-0.1.0-alpha.zip
            dist/packages/web-game-engineer-doubao-0.1.0-alpha.zip.sha256
          )
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Web & Game Engineer — 六平台统一安装包" \
            --prerelease \
            --notes "一次下载六个平台适配包：ChatGPT、Claude、Gemini、DeepSeek、Qwen、Doubao。每个 ZIP 均附 SHA-256 校验文件。各平台当前兼容状态以仓库 acceptance matrix 为准；尚未完成宿主实测的平台仍标记为 Experimental / NOT CERTIFIED。"
