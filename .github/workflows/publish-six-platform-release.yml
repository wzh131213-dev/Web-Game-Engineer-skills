name: Publish six-platform GitHub Release

on:
  workflow_run:
    workflows: ["Build and publish skill ZIP packages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout packaged main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Verify all six platform ZIPs and checksums
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.release' release/VERSION.json)"
          TAG="$(jq -r '.release_tag' release/VERSION.json)"
          test -n "$VERSION" && test -n "$TAG"
          platforms=(chatgpt claude gemini deepseek qwen doubao)
          : > "$RUNNER_TEMP/release-assets.txt"
          for platform in "${platforms[@]}"; do
            archive="$(jq -r '.zip_archive' "packages/$platform/PACKAGE_MANIFEST.json")"
            test -s "$archive" && test -s "$archive.sha256"
            sha256sum -c "$archive.sha256"
            unzip -t "$archive" >/dev/null
            printf '%s\n%s.sha256\n' "$archive" "$archive" >> "$RUNNER_TEMP/release-assets.txt"
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create immutable unified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.verify.outputs.tag }}"
          VERSION="${{ steps.verify.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite immutable release assets."
            exit 1
          fi
          mapfile -t assets < "$RUNNER_TEMP/release-assets.txt"
          gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target main \
            --title "Web & Game Engineer $VERSION — 六平台一句话构建版" --prerelease \
            --notes "六个平台统一更新至 $VERSION。新增默认一句话建站/游戏构建模式，目标为专业中上游独立 Web/游戏首版，非 AAA 承诺。每个 ZIP 附 SHA-256。所有平台保持各自独立验收状态；未完成宿主验证的适配器仍为 Experimental / NOT CERTIFIED。"
